<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4" viewBox="0 0 1200 4" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#d78a3c" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#f0a85a"/>
      <stop offset="1" stop-color="#fff3e0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="4" rx="2" fill="#d78a3c" opacity="0.18"/>
  <rect y="0" width="260" height="4" rx="2" fill="url(#glow)">
    <animate attributeName="x" from="-260" to="1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
