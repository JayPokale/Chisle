<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" xml:space="preserve" role="img" aria-label="Command-aware filters on real output, raw characters to what Claude reads: npm test 19,374 to 445 (98% less), a failing npm test 16,107 to 309 (98% less), git status 485 to 92 (81% less), git log -n 15 6,561 to 3,784 (42% less). Across 37 commands Claude reads 28% of the raw output with Chisle and 100% with caveman or ponytail, which never touch tool output. Errors, failures and summaries always stay.">
<rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="28" y="42" font-size="19" font-weight="700" fill="#1f2328">명령을 알고, 잡음을 걷어낸다.</text>
<text x="852" y="42" font-size="13" fill="#59636e" text-anchor="end">원본 출력 → Claude가 읽는 것</text>
<text x="28" y="68" font-size="13.5" fill="#59636e">명령 인식 필터 내장: 추가 바이너리 없이 모든 OS에서. 오류, 실패, 요약은 항상 남긴다.</text>
<text x="28" y="111" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#b35a14">$ npm test</text>
<text x="28" y="130" font-size="12" fill="#59636e">통과한 테스트 256개 숨김, 요약은 유지</text>
<rect x="330" y="99" width="420" height="16" rx="5" fill="#afb8c1" fill-opacity="0.35"/>
<rect x="330" y="99" width="9.6" height="16" rx="5" fill="#d78a3c"><animate attributeName="width" values="420;420;9.6;9.6;420;420" keyTimes="0.0000;0.0889;0.2000;0.9444;0.9833;1.0000" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></rect>
<text x="330" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#818b98">19,374 → 445 자</text>
<text x="852" y="113" font-size="17" font-weight="700" fill="#b35a14" text-anchor="end"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2222;0.9444;0.9667;1.0000" dur="9s" repeatCount="indefinite"/>−98%</text>
<text x="28" y="161" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#b35a14">$ npm test  # 1 failing</text>
<text x="28" y="180" font-size="12" fill="#59636e">통과 400개 숨김, 실패는 전부 유지</text>
<rect x="330" y="149" width="420" height="16" rx="5" fill="#afb8c1" fill-opacity="0.35"/>
<rect x="330" y="149" width="8.1" height="16" rx="5" fill="#d78a3c"><animate attributeName="width" values="420;420;8.1;8.1;420;420" keyTimes="0.0000;0.1389;0.2500;0.9444;0.9833;1.0000" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></rect>
<text x="330" y="182" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#818b98">16,107 → 309 자</text>
<text x="852" y="163" font-size="17" font-weight="700" fill="#b35a14" text-anchor="end"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2500;0.2722;0.9444;0.9667;1.0000" dur="9s" repeatCount="indefinite"/>−98%</text>
<text x="28" y="211" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#b35a14">$ git status</text>
<text x="28" y="230" font-size="12" fill="#59636e">긴 형식을 git의 짧은 형식으로</text>
<rect x="330" y="199" width="420" height="16" rx="5" fill="#afb8c1" fill-opacity="0.35"/>
<rect x="330" y="199" width="79.7" height="16" rx="5" fill="#d78a3c"><animate attributeName="width" values="420;420;79.7;79.7;420;420" keyTimes="0.0000;0.1889;0.3000;0.9444;0.9833;1.0000" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></rect>
<text x="330" y="232" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#818b98">485 → 92 자</text>
<text x="852" y="213" font-size="17" font-weight="700" fill="#b35a14" text-anchor="end"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3222;0.9444;0.9667;1.0000" dur="9s" repeatCount="indefinite"/>−81%</text>
<text x="28" y="261" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#b35a14">$ git log -n 15</text>
<text x="28" y="280" font-size="12" fill="#59636e">커밋당 한 줄, 긴 메시지는 줄 수만</text>
<rect x="330" y="249" width="420" height="16" rx="5" fill="#afb8c1" fill-opacity="0.35"/>
<rect x="330" y="249" width="242.2" height="16" rx="5" fill="#d78a3c"><animate attributeName="width" values="420;420;242.2;242.2;420;420" keyTimes="0.0000;0.2389;0.3500;0.9444;0.9833;1.0000" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></rect>
<text x="330" y="282" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#818b98">6,561 → 3,784 자</text>
<text x="852" y="263" font-size="17" font-weight="700" fill="#b35a14" text-anchor="end"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3500;0.3722;0.9444;0.9667;1.0000" dur="9s" repeatCount="indefinite"/>−42%</text>
<text x="28" y="318" font-size="12.5" fill="#818b98">명령 37개: Claude가 읽는 원본 출력은 Chisle 28%, caveman·ponytail 100%. 실패한 실행도 bypass 모드에서 필터링; | cat 이면 원본.</text>
</svg>
