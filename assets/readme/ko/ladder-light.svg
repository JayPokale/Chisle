<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" xml:space="preserve" role="img" aria-label="The Chisle efficiency ladder. Before writing code, stop at the first rung that holds: 1 does this need to exist at all, 2 already in this codebase, 3 does the stdlib do it, 4 a native platform feature, 5 an already-installed dependency, 6 can it be one line, 7 only then the minimum code that works. Animated examples: deep-copying a config object stops at the stdlib with structuredClone; a date picker stops at the platform with input type date; formatting a date stops at reuse.">
<rect x="0.5" y="0.5" width="879" height="395" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="28" y="40" font-size="16" font-weight="700" fill="#1f2328">코드를 쓰기 전에, 성립하는 첫 단계에서 멈춥니다</text>
<path d="M46 78V294" stroke="#d0d7de" stroke-width="2"/>
<rect x="20" y="96" width="840" height="32" rx="8" fill="#d78a3c" fill-opacity="0.13" stroke="#d78a3c" stroke-opacity="0.55"><animate attributeName="y" values="60;60;60;96;96;132;132;60;60;96;96;132;132;168;168;60;60;96;96;96" keyTimes="0.0000;0.0015;0.0444;0.0667;0.0778;0.1000;0.3296;0.3348;0.3778;0.4000;0.4111;0.4333;0.4444;0.4667;0.6630;0.6681;0.7111;0.7333;0.9963;1.0000" dur="13.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></rect>
<circle cx="46" cy="112" r="15" fill="none" stroke="#d78a3c" stroke-width="2"><animate attributeName="cy" values="76;76;76;112;112;148;148;76;76;112;112;148;148;184;184;76;76;112;112;112" keyTimes="0.0000;0.0015;0.0444;0.0667;0.0778;0.1000;0.3296;0.3348;0.3778;0.4000;0.4111;0.4333;0.4444;0.4667;0.6630;0.6681;0.7111;0.7333;0.9963;1.0000" dur="13.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></circle>
<circle cx="46" cy="78" r="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="46" y="82.5" font-size="12.5" font-weight="700" fill="#b35a14" text-anchor="middle">1</text>
<text x="72" y="84" font-size="14.5" font-weight="600" fill="#1f2328">꼭 있어야 하나?</text>
<text x="420" y="84" font-size="13.5" fill="#59636e">→ 건너뛰고 한 줄로 알리기</text>
<circle cx="46" cy="114" r="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="46" y="118.5" font-size="12.5" font-weight="700" fill="#b35a14" text-anchor="middle">2</text>
<text x="72" y="120" font-size="14.5" font-weight="600" fill="#1f2328">이미 코드베이스에 있나?</text>
<text x="420" y="120" font-size="13.5" fill="#59636e">→ 재사용하기</text>
<circle cx="46" cy="150" r="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="46" y="154.5" font-size="12.5" font-weight="700" fill="#b35a14" text-anchor="middle">3</text>
<text x="72" y="156" font-size="14.5" font-weight="600" fill="#1f2328">표준 라이브러리로 되나?</text>
<text x="420" y="156" font-size="13.5" fill="#59636e">→ 표준 라이브러리 쓰기</text>
<circle cx="46" cy="186" r="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="46" y="190.5" font-size="12.5" font-weight="700" fill="#b35a14" text-anchor="middle">4</text>
<text x="72" y="192" font-size="14.5" font-weight="600" fill="#1f2328">플랫폼 기본 기능이 있나?</text>
<text x="420" y="192" font-size="13.5" fill="#59636e">→ JS보다 CSS, 앱 코드보다 DB 제약</text>
<circle cx="46" cy="222" r="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="46" y="226.5" font-size="12.5" font-weight="700" fill="#b35a14" text-anchor="middle">5</text>
<text x="72" y="228" font-size="14.5" font-weight="600" fill="#1f2328">이미 설치된 의존성이 있나?</text>
<text x="420" y="228" font-size="13.5" fill="#59636e">→ 그걸 쓰고, 새로 추가하지 않기</text>
<circle cx="46" cy="258" r="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="46" y="262.5" font-size="12.5" font-weight="700" fill="#b35a14" text-anchor="middle">6</text>
<text x="72" y="264" font-size="14.5" font-weight="600" fill="#1f2328">한 줄로 되나?</text>
<text x="420" y="264" font-size="13.5" fill="#59636e">→ 한 줄로</text>
<circle cx="46" cy="294" r="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="46" y="298.5" font-size="12.5" font-weight="700" fill="#b35a14" text-anchor="middle">7</text>
<text x="72" y="300" font-size="14.5" font-weight="600" fill="#1f2328">그때서야</text>
<text x="420" y="300" font-size="13.5" fill="#59636e">→ 동작하는 최소한의 코드</text>
<path d="M20 326H860" stroke="#d0d7de"/>
<text x="28" y="356" font-size="14" fill="#59636e" opacity="0">요청: <tspan fill="#1f2328" font-weight="600">설정 객체 깊은 복사</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0007;0.0156;0.3185;0.3333;1.0000" dur="13.5s" repeatCount="indefinite"/></text>
<text x="852" y="356" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="end" fill="#1a7f37" opacity="0">✓ 3단계: structuredClone(config)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1185;0.1333;0.3185;0.3333;1.0000" dur="13.5s" repeatCount="indefinite"/></text>
<text x="28" y="356" font-size="14" fill="#59636e" opacity="0">요청: <tspan fill="#1f2328" font-weight="600">날짜 선택기 추가</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3341;0.3489;0.6519;0.6667;1.0000" dur="13.5s" repeatCount="indefinite"/></text>
<text x="852" y="356" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="end" fill="#1a7f37" opacity="0">✓ 4단계: &lt;input type=&quot;date&quot;&gt;<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4852;0.5000;0.6519;0.6667;1.0000" dur="13.5s" repeatCount="indefinite"/></text>
<text x="28" y="356" font-size="14" fill="#59636e" opacity="1">요청: <tspan fill="#1f2328" font-weight="600">UI용 날짜 서식 지정</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6674;0.6822;0.9852;1.0000" dur="13.5s" repeatCount="indefinite"/></text>
<text x="852" y="356" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="end" fill="#1a7f37" opacity="1">✓ 2단계: utils/formatDate() 재사용<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7519;0.7667;0.9852;1.0000" dur="13.5s" repeatCount="indefinite"/></text>
</svg>
