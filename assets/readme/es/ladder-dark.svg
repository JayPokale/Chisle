<circle cx="46" cy="112" r="15" fill="none" stroke="#d78a3c" stroke-width="2"><animate attributeName="cy" values="76;76;76;112;112;148;148;76;76;112;112;148;148;184;184;76;76;112;112;112" keyTimes="0.0000;0.0015;0.0444;0.0667;0.0778;0.1000;0.3296;0.3348;0.3778;0.4000;0.4111;0.4333;0.4444;0.4667;0.6630;0.6681;0.7111;0.7333;0.9963;1.0000" dur="13.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></circle>
<circle cx="46" cy="78" r="12" fill="#161b22" stroke="#30363d"/><text x="46" y="82.5" font-size="12.5" font-weight="700" fill="#f0a85a" text-anchor="middle">1</text>
<text x="72" y="84" font-size="14.5" font-weight="600" fill="#e6edf3">¿Hace falta que exista?</text>
<text x="420" y="84" font-size="13.5" fill="#8b949e">→ sáltalo y dilo en una línea</text>
<circle cx="46" cy="114" r="12" fill="#161b22" stroke="#30363d"/><text x="46" y="118.5" font-size="12.5" font-weight="700" fill="#f0a85a" text-anchor="middle">2</text>
<text x="72" y="120" font-size="14.5" font-weight="600" fill="#e6edf3">¿Ya está en este código?</text>
<text x="420" y="120" font-size="13.5" fill="#8b949e">→ reutilízalo</text>
<circle cx="46" cy="150" r="12" fill="#161b22" stroke="#30363d"/><text x="46" y="154.5" font-size="12.5" font-weight="700" fill="#f0a85a" text-anchor="middle">3</text>
<text x="72" y="156" font-size="14.5" font-weight="600" fill="#e6edf3">¿Lo hace la biblioteca estándar?</text>
<text x="420" y="156" font-size="13.5" fill="#8b949e">→ usa la biblioteca estándar</text>
<circle cx="46" cy="186" r="12" fill="#161b22" stroke="#30363d"/><text x="46" y="190.5" font-size="12.5" font-weight="700" fill="#f0a85a" text-anchor="middle">4</text>
<text x="72" y="192" font-size="14.5" font-weight="600" fill="#e6edf3">¿Una función nativa de la plataforma?</text>
<text x="420" y="192" font-size="13.5" fill="#8b949e">→ CSS antes que JS, restricción de BD antes que código</text>
<circle cx="46" cy="222" r="12" fill="#161b22" stroke="#30363d"/><text x="46" y="226.5" font-size="12.5" font-weight="700" fill="#f0a85a" text-anchor="middle">5</text>
<text x="72" y="228" font-size="14.5" font-weight="600" fill="#e6edf3">¿Una dependencia ya instalada?</text>
<text x="420" y="228" font-size="13.5" fill="#8b949e">→ úsala, nunca añadas otra</text>
<circle cx="46" cy="258" r="12" fill="#161b22" stroke="#30363d"/><text x="46" y="262.5" font-size="12.5" font-weight="700" fill="#f0a85a" text-anchor="middle">6</text>
<text x="72" y="264" font-size="14.5" font-weight="600" fill="#e6edf3">¿Cabe en una línea?</text>
<text x="420" y="264" font-size="13.5" fill="#8b949e">→ una línea</text>
<circle cx="46" cy="294" r="12" fill="#161b22" stroke="#30363d"/><text x="46" y="298.5" font-size="12.5" font-weight="700" fill="#f0a85a" text-anchor="middle">7</text>
<text x="72" y="300" font-size="14.5" font-weight="600" fill="#e6edf3">Solo entonces</text>
<text x="420" y="300" font-size="13.5" fill="#8b949e">→ el código mínimo que funciona</text>
<path d="M20 326H860" stroke="#30363d"/>
