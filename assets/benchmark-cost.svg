<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Total cost of 3 real agent tasks with noisy commands, as percent of the same agent with no ruleset, no RTK in any arm, each ruleset's own cached prompt not counted. no ruleset 100%, caveman 120%, ponytail 104%, Chisle 87%.">
<rect x="0.5" y="0.5" width="859" height="299" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="430" y="34" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Cost of real agent tasks, % of the same agent with no ruleset</text>
<text x="430" y="54" font-size="11.5" fill="#8b949e" text-anchor="middle">3 noisy-command tasks (failing test, 391-test suite, bug in a big commit), Haiku 4.5, 3 runs each, all fixed; no RTK; cached ruleset prompts not counted</text>
<line x1="624.5454545454545" y1="78" x2="624.5454545454545" y2="282" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/><text x="624.5454545454545" y="72" font-size="11" fill="#8b949e" text-anchor="middle">100% = no ruleset</text><text x="158" y="113" font-size="14" fill="#c9d1d9" text-anchor="end">no ruleset</text><rect x="170" y="94" width="454.54545454545456" height="28" rx="5" fill="#484f58"><animate attributeName="width" values="0;454.54545454545456" dur="0.9s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="633.5454545454545" y="113" font-size="13" fill="#c9d1d9">100%</text><text x="158" y="163" font-size="14" fill="#c9d1d9" text-anchor="end">caveman</text><rect x="170" y="144" width="545.4545454545455" height="28" rx="5" fill="#484f58"><animate attributeName="width" values="0;545.4545454545455" dur="0.9s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="724.4545454545455" y="163" font-size="13" fill="#c9d1d9">120%</text><text x="158" y="213" font-size="14" fill="#c9d1d9" text-anchor="end">ponytail</text><rect x="170" y="194" width="472.72727272727275" height="28" rx="5" fill="#484f58"><animate attributeName="width" values="0;472.72727272727275" dur="0.9s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="651.7272727272727" y="213" font-size="13" fill="#c9d1d9">104%</text><text x="158" y="263" font-size="14" fill="#f0a85a" text-anchor="end" font-weight="700">Chisle</text><rect x="170" y="244" width="395.4545454545455" height="28" rx="5" fill="#d78a3c"><animate attributeName="width" values="0;395.4545454545455" dur="0.9s" begin="0.36s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="574.4545454545455" y="263" font-size="13" fill="#f0a85a" font-weight="700">87%</text></svg>
