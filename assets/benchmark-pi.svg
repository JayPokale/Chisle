<svg xmlns="http://www.w3.org/2000/svg" width="860" height="316" viewBox="0 0 860 316" role="img" aria-label="Pi benchmark, 6 tasks on GPT-5.5, as percent of no ruleset. caveman: answer length 56%, billed tokens 72%; ponytail: answer length 49%, billed tokens 59%; Chisle: answer length 37%, billed tokens 61%.">
<rect width="860" height="316" rx="10" fill="#0d1117"/>
<text x="430" y="34" font-size="17" font-weight="700" fill="#c9d1d9" text-anchor="middle">Pi + GPT-5.5 — % of the same model with no ruleset</text>
<text x="430" y="54" font-size="11.5" fill="#8b949e" text-anchor="middle">6 tasks, one run; solid = answer length the user reads, faint = billed tokens; lower = leaner</text>
<line x1="666.6666666666667" y1="78" x2="666.6666666666667" y2="298" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/><text x="666.6666666666667" y="72" font-size="11" fill="#8b949e" text-anchor="middle">100% = no ruleset</text><text x="138" y="119" font-size="14" fill="#c9d1d9" text-anchor="end">caveman</text><rect x="150" y="94" width="289.33333333333337" height="24" rx="4" fill="#d9822b"/><text x="448.33333333333337" y="111" font-size="13" fill="#c9d1d9">56% answer length</text><rect x="150" y="122" width="372" height="14" rx="3" fill="#d9822b" opacity="0.4"/><text x="531" y="134" font-size="11.5" fill="#8b949e">72% billed tokens</text><text x="138" y="191" font-size="14" fill="#c9d1d9" text-anchor="end">ponytail</text><rect x="150" y="166" width="253.16666666666669" height="24" rx="4" fill="#cf3b3b"/><text x="412.1666666666667" y="183" font-size="13" fill="#c9d1d9">49% answer length</text><rect x="150" y="194" width="304.83333333333337" height="14" rx="3" fill="#cf3b3b" opacity="0.4"/><text x="463.83333333333337" y="206" font-size="11.5" fill="#8b949e">59% billed tokens</text><text x="138" y="263" font-size="14" fill="#c9d1d9" text-anchor="end" font-weight="700">Chisle</text><rect x="150" y="238" width="191.16666666666669" height="24" rx="4" fill="#2da44e"/><text x="350.1666666666667" y="255" font-size="13" fill="#c9d1d9" font-weight="700">37% answer length</text><rect x="150" y="266" width="315.1666666666667" height="14" rx="3" fill="#2da44e" opacity="0.4"/><text x="474.1666666666667" y="278" font-size="11.5" fill="#8b949e">61% billed tokens</text></svg>
