<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Total cost of 3 real agent tasks with noisy commands, as percent of the same agent with no ruleset, no RTK in any arm. no ruleset 100%, caveman 123%, ponytail 109%, Chisle 90%.">
<rect x="0.5" y="0.5" width="859" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="430" y="34" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Cost of real agent tasks, % of the same agent with no ruleset</text>
<text x="430" y="54" font-size="11.5" fill="#59636e" text-anchor="middle">3 tasks with noisy commands (failing test, 391-test suite, bug in a big commit), Haiku 4.5, 3 runs each, all fixed; no RTK</text>
<line x1="614.4444444444445" y1="78" x2="614.4444444444445" y2="282" stroke="#59636e" stroke-width="1.5" stroke-dasharray="4 3"/><text x="614.4444444444445" y="72" font-size="11" fill="#59636e" text-anchor="middle">100% = no ruleset</text><text x="158" y="113" font-size="14" fill="#31363c" text-anchor="end">no ruleset</text><rect x="170" y="94" width="444.44444444444446" height="28" rx="5" fill="#afb8c1"><animate attributeName="width" values="0;444.44444444444446" dur="0.9s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="623.4444444444445" y="113" font-size="13" fill="#31363c">100%</text><text x="158" y="163" font-size="14" fill="#31363c" text-anchor="end">caveman</text><rect x="170" y="144" width="546.6666666666667" height="28" rx="5" fill="#afb8c1"><animate attributeName="width" values="0;546.6666666666667" dur="0.9s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="725.6666666666667" y="163" font-size="13" fill="#31363c">123%</text><text x="158" y="213" font-size="14" fill="#31363c" text-anchor="end">ponytail</text><rect x="170" y="194" width="484.44444444444446" height="28" rx="5" fill="#afb8c1"><animate attributeName="width" values="0;484.44444444444446" dur="0.9s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="663.4444444444445" y="213" font-size="13" fill="#31363c">109%</text><text x="158" y="263" font-size="14" fill="#b35a14" text-anchor="end" font-weight="700">Chisle</text><rect x="170" y="244" width="400" height="28" rx="5" fill="#d78a3c"><animate attributeName="width" values="0;400" dur="0.9s" begin="0.36s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="622.4444444444445" y="263" font-size="13" fill="#b35a14" font-weight="700">90%</text></svg>
