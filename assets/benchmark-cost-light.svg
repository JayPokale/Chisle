<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Cost per fix on a real agent task, fixing a failing npm test, as percent of the same agent with no ruleset. Chisle 3.14 is 47% cheaper than 3.13. caveman 109%, ponytail 93%, RTK 96%, Chisle 73%.">
<rect x="0.5" y="0.5" width="859" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="430" y="34" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Cost per fix on a real agent task, % of the same agent with no ruleset</text>
<text x="430" y="54" font-size="11.5" fill="#59636e" text-anchor="middle">Fix a failing npm test (17k-char log) in a real repo, Haiku 4.5, 3 runs per arm, every run fixed it; Chisle 3.14 is 47% cheaper than 3.13</text>
<line x1="715.4545454545454" y1="78" x2="715.4545454545454" y2="282" stroke="#59636e" stroke-width="1.5" stroke-dasharray="4 3"/><text x="715.4545454545454" y="72" font-size="11" fill="#59636e" text-anchor="middle">100% = no ruleset</text><text x="158" y="113" font-size="14" fill="#31363c" text-anchor="end">caveman</text><rect x="170" y="94" width="594.5454545454545" height="28" rx="5" fill="#afb8c1"><animate attributeName="width" values="0;594.5454545454545" dur="0.9s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="773.5454545454545" y="113" font-size="13" fill="#31363c">109%</text><text x="158" y="163" font-size="14" fill="#31363c" text-anchor="end">ponytail</text><rect x="170" y="144" width="507.27272727272725" height="28" rx="5" fill="#afb8c1"><animate attributeName="width" values="0;507.27272727272725" dur="0.9s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="723.4545454545454" y="163" font-size="13" fill="#31363c">93%</text><text x="158" y="213" font-size="14" fill="#31363c" text-anchor="end">RTK</text><rect x="170" y="194" width="523.6363636363636" height="28" rx="5" fill="#afb8c1"><animate attributeName="width" values="0;523.6363636363636" dur="0.9s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="723.4545454545454" y="213" font-size="13" fill="#31363c">96%</text><text x="158" y="263" font-size="14" fill="#b35a14" text-anchor="end" font-weight="700">Chisle</text><rect x="170" y="244" width="398.18181818181813" height="28" rx="5" fill="#d78a3c"><animate attributeName="width" values="0;398.18181818181813" dur="0.9s" begin="0.36s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></rect><text x="577.1818181818181" y="263" font-size="13" fill="#b35a14" font-weight="700">73%</text></svg>
