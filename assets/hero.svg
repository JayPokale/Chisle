<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Chisle versus the same model with no ruleset: 29% fewer billed output tokens, answers 45% shorter, oversized tool output 48% smaller, accuracy 156 of 156 versus 154 of 156.">
<rect width="880" height="236" rx="14" fill="#0d1117"/>
<text x="440.0" y="34" font-size="14" fill="#8b949e" text-anchor="middle">Chisle vs the same model with no ruleset</text>
<g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.000;1" dur="0.60s" fill="freeze"/><rect x="20" y="52" width="196" height="164" rx="10" fill="#161b22" stroke="#30363d"/><text x="38" y="108" font-size="40" font-weight="800" fill="#d78a3c">−29%</text><text x="38" y="138" font-size="15" font-weight="600" fill="#e6edf3">billed output tokens</text><text x="38" y="160" font-size="12" fill="#8b949e">71% of the bare model</text><rect x="38" y="182" width="160" height="8" rx="4" fill="#30363d"/><rect x="38" y="182" width="113.6" height="8" rx="4" fill="#d78a3c"><animate attributeName="width" values="160;160;113.6;113.6" keyTimes="0;0.2;0.5;1" dur="5s" repeatCount="indefinite"/></rect></g>
<g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.200;1" dur="0.75s" fill="freeze"/><rect x="232" y="52" width="196" height="164" rx="10" fill="#161b22" stroke="#30363d"/><text x="250" y="108" font-size="40" font-weight="800" fill="#d78a3c">−45%</text><text x="250" y="138" font-size="15" font-weight="600" fill="#e6edf3">answer length</text><text x="250" y="160" font-size="12" fill="#8b949e">55% of the bare model</text><rect x="250" y="182" width="160" height="8" rx="4" fill="#30363d"/><rect x="250" y="182" width="88.0" height="8" rx="4" fill="#d78a3c"><animate attributeName="width" values="160;160;88.0;88.0" keyTimes="0;0.2;0.5;1" dur="5s" repeatCount="indefinite"/></rect></g>
<g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.90s" fill="freeze"/><rect x="444" y="52" width="196" height="164" rx="10" fill="#161b22" stroke="#30363d"/><text x="462" y="108" font-size="40" font-weight="800" fill="#d78a3c">−48%</text><text x="462" y="138" font-size="15" font-weight="600" fill="#e6edf3">oversized tool output</text><text x="462" y="160" font-size="12" fill="#8b949e">per trimmed tool output</text><rect x="462" y="182" width="160" height="8" rx="4" fill="#30363d"/><rect x="462" y="182" width="83.2" height="8" rx="4" fill="#d78a3c"><animate attributeName="width" values="160;160;83.2;83.2" keyTimes="0;0.2;0.5;1" dur="5s" repeatCount="indefinite"/></rect></g>
<g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.429;1" dur="1.05s" fill="freeze"/><rect x="656" y="52" width="196" height="164" rx="10" fill="#161b22" stroke="#30363d"/><text x="674" y="108" font-size="40" font-weight="800" fill="#2da44e">156/156</text><text x="674" y="138" font-size="15" font-weight="600" fill="#e6edf3">accuracy</text><text x="674" y="160" font-size="12" fill="#8b949e">bare model: 154/156</text><rect x="674" y="182" width="160" height="8" rx="4" fill="#30363d"/><rect x="674" y="182" width="160.0" height="8" rx="4" fill="#2da44e"></rect></g>
