<text x="430" y="34" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Claude Code + Opus 5.5: billed output tokens, % of the same model with no ruleset</text>
<text x="430" y="54" font-size="11.5" fill="#59636e" text-anchor="middle">39 answers (13 prompts × 3 runs), all arms in one session, every arm answered every prompt; lower = cheaper</text>
