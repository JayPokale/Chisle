<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Claude Code with Opus 5.5, 39 answers in one session, billed output tokens as percent of the same model with no ruleset. no ruleset 100%, caveman 86%, ponytail 58%, Chisle 51%.">
